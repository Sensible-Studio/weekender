# Builds the packages and attaches them to a GitHub release:  git tag v1.0.1 && git push origin v1.0.1
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B -q clean install
      - uses: actions/upload-artifact@v4
        with:
          name: weekender
          path: all/target/weekender.all-*.zip
          if-no-files-found: error
      - name: Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" all/target/weekender.all-*.zip \
            --repo "$GITHUB_REPOSITORY" --title "Weekender ${GITHUB_REF_NAME#v}" --generate-notes
